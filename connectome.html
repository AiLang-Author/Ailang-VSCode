<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111118; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
canvas { display:block; cursor:grab; }
canvas.dragging { cursor:grabbing; }
#hud {
    position:fixed; top:8px; left:8px; right:8px;
    display:flex; gap:8px; align-items:center; z-index:10; pointer-events:none;
}
#hud > * { pointer-events:auto; }
#back-btn {
    background:#1e1e2e; border:1px solid #f97316; border-radius:4px;
    color:#f97316; padding:5px 12px; font-size:11px; cursor:pointer;
    display:none; transition:all 0.15s;
}
#back-btn:hover { background:#f97316; color:#fff; }
#breadcrumb { color:#666; font-size:11px; white-space:nowrap; }
#breadcrumb span { color:#d4d4d4; }
#search {
    background:#1e1e2e; border:1px solid #333; border-radius:4px;
    color:#d4d4d4; padding:5px 10px; font-size:12px; width:200px; outline:none;
}
#search:focus { border-color:#a855f7; }
.filter-btn {
    background:#1e1e2e; border:1px solid #333; border-radius:4px;
    color:#888; padding:4px 8px; font-size:11px; cursor:pointer; transition:all 0.15s;
}
.filter-btn:hover { border-color:#555; color:#ccc; }
.filter-btn.active { border-color:var(--fc); color:var(--fc); background:rgba(255,255,255,0.05); }
#group-filters { display:none; gap:4px; }
#stats { margin-left:auto; color:#444; font-size:10px; letter-spacing:0.5px; }
#tooltip {
    display:none; position:fixed; background:#1e1e2e; border:1px solid #444;
    border-radius:6px; padding:10px 14px; color:#d4d4d4; font-size:12px;
    z-index:20; pointer-events:none; max-width:300px; box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#tooltip .tt-kind { font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
#tooltip .tt-name { font-size:14px; font-weight:600; margin-bottom:6px; }
#tooltip .tt-detail { color:#888; font-size:11px; white-space:pre-wrap; }
#tooltip .tt-hint { color:#555; font-size:10px; margin-top:6px; border-top:1px solid #2a2a2a; padding-top:6px; }
#detail-panel {
    display:none; position:fixed; right:0; top:0; bottom:0; width:280px;
    background:#161622; border-left:1px solid #2a2a2a; z-index:15;
    padding:16px; overflow-y:auto; color:#d4d4d4;
}
#detail-panel .dp-close { position:absolute; top:8px; right:12px; cursor:pointer; color:#666; font-size:18px; line-height:1; }
#detail-panel .dp-close:hover { color:#fff; }
#detail-panel .dp-kind { font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
#detail-panel .dp-name { font-size:18px; font-weight:700; margin-bottom:4px; }
#detail-panel .dp-scope { font-size:12px; color:#888; margin-bottom:12px; }
#detail-panel .dp-section { margin-bottom:12px; }
#detail-panel .dp-section-title { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#666; margin-bottom:6px; }
#detail-panel .dp-link {
    display:block; padding:4px 8px; margin:2px 0; border-radius:3px;
    color:#a855f7; font-size:12px; cursor:pointer; text-decoration:none; transition:background 0.1s;
}
#detail-panel .dp-link:hover { background:rgba(168,85,247,0.1); }
#detail-panel .dp-goto {
    display:inline-block; margin-top:8px; padding:6px 14px;
    background:#a855f7; color:#fff; border:none; border-radius:4px;
    font-size:12px; cursor:pointer; transition:opacity 0.15s;
}
#detail-panel .dp-goto:hover { opacity:0.85; }
#legend {
    position:fixed; bottom:8px; left:8px; display:flex; gap:10px;
    font-size:10px; color:#555; z-index:10;
}
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-dot { width:8px; height:8px; border-radius:50%; }
</style>
</head>

<body>
<div id="hud">
    <button id="back-btn">&larr; Overview</button>
    <div id="breadcrumb"></div>
    <button id="open-file-btn" class="filter-btn" style="--fc:#22d3ee;display:none">Open file</button>
    <input id="search" type="text" placeholder="Search symbols..." autocomplete="off">
    <button id="links-btn" class="filter-btn" style="--fc:#eab308;display:none">All links</button>
    <div id="group-filters">
        <button class="filter-btn active" data-group="all" style="--fc:#fff">All</button>
        <button class="filter-btn active" data-group="Imports" style="--fc:#e94560">Imports</button>
        <button class="filter-btn active" data-group="Pools" style="--fc:#0f8bff">Pools</button>
        <button class="filter-btn active" data-group="Functions" style="--fc:#a855f7">Functions</button>
        <button class="filter-btn active" data-group="SubRoutines" style="--fc:#f97316">SubRoutines</button>
        <button class="filter-btn active" data-group="Loops" style="--fc:#16a085">Loops</button>
    </div>
    <span id="stats"></span>
</div>
<div id="tooltip"><div class="tt-kind"></div><div class="tt-name"></div><div class="tt-detail"></div><div class="tt-hint"></div></div>
<div id="detail-panel">
    <span class="dp-close">&times;</span>
    <div class="dp-kind"></div>
    <div class="dp-name"></div>
    <div class="dp-scope"></div>
    <div id="dp-calls-out" class="dp-section"></div>
    <div id="dp-calls-in" class="dp-section"></div>
    <div id="dp-children" class="dp-section"></div>
    <button class="dp-goto" id="dp-goto">Go to Definition</button>
    <button class="dp-goto" id="dp-open-file" style="display:none;background:#e94560;margin-left:4px;">Open File</button>
</div>
<div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>Import</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0f8bff"></div>Pool</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div>Function</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>SubRoutine</div>
    <div class="legend-item"><div class="legend-dot" style="background:#16a085"></div>Loop</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316;border-radius:0;width:12px;height:2px"></div>Cross-file</div>
</div>
<canvas id="c"></canvas>
<script>
(function(){
var vscode = acquireVsCodeApi();
var data = window.__graphData || { nodes: [], edges: [], imports: [] };
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var tooltip = document.getElementById('tooltip');
var detail = document.getElementById('detail-panel');
var searchInput = document.getElementById('search');
var statsEl = document.getElementById('stats');
var backBtn = document.getElementById('back-btn');
var breadcrumb = document.getElementById('breadcrumb');
var groupFiltersEl = document.getElementById('group-filters');

var W, H, dpr;
function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', function() { resize(); draw(); });

// ═══════════════════════════════════════════
// DATA SETUP
// ═══════════════════════════════════════════
var colorMap = {
    'Imports':'#e94560','Pools':'#0f8bff','Functions':'#a855f7',
    'SubRoutines':'#f97316','Loops':'#16a085','Fields':'#6b7280',
    'Exports':'#eab308','Macros':'#ec4899'
};
var fileColorPalette = [
    '#e94560','#0f8bff','#a855f7','#f97316','#16a085',
    '#eab308','#ec4899','#06b6d4','#84cc16','#f43f5e',
    '#8b5cf6','#14b8a6','#f59e0b','#6366f1','#22d3ee'
];

var allNodes = data.nodes.map(function(n, i) {
    var angle = (i / Math.max(data.nodes.length, 1)) * Math.PI * 2;
    var r = 120 + Math.random() * 80;
    return {
        id: n.id, label: n.label, kind: n.kind, group: n.group,
        color: n.color, line: n.line, scope: n.scope, file: n.file || 'main',
        x: W/2 + Math.cos(angle) * r, y: H/2 + Math.sin(angle) * r,
        vx: 0, vy: 0,
        radius: n.group === 'Fields' ? 6 : (n.kind === 'SubRoutine' ? 14 : 10),
        visible: true, matched: true
    };
});
var allNodeMap = {};
allNodes.forEach(function(n) { allNodeMap[n.id] = n; });

var allEdges = data.edges.map(function(e) {
    return { source: allNodeMap[e.from], target: allNodeMap[e.to], type: e.type || 'call', crossFile: e.crossFile };
}).filter(function(e) { return e.source && e.target; });

// File grouping
var fileSet = {};
allNodes.forEach(function(n) { fileSet[n.file] = true; });
var fileList = Object.keys(fileSet).sort();
var fileColors = {};
fileList.forEach(function(f, i) { fileColors[f] = fileColorPalette[i % fileColorPalette.length]; });

var fileMeta = {};
fileList.forEach(function(f) {
    var fNodes = allNodes.filter(function(n) { return n.file === f; });
    var topLevel = fNodes.filter(function(n) {
        return !n.scope && ['Functions','Pools','SubRoutines','Imports','Exports'].indexOf(n.group) >= 0;
    });
    fileMeta[f] = { nodes: fNodes, topLevel: topLevel, count: fNodes.length };
});

// Inter-file edges
var interFileMap = {};
allEdges.forEach(function(e) {
    if (!e.source || !e.target) return;
    if (e.source.file !== e.target.file && e.type !== 'scope') {
        var key = e.source.file + '|' + e.target.file;
        if (!interFileMap[key]) interFileMap[key] = { from: e.source.file, to: e.target.file, count: 0 };
        interFileMap[key].count++;
    }
});
var interFileList = [];
Object.keys(interFileMap).forEach(function(k) { interFileList.push(interFileMap[k]); });

// ═══════════════════════════════════════════
// OVERVIEW BUBBLES
// ═══════════════════════════════════════════
var multiFile = fileList.length > 1;
var compactOverview = fileList.length > 8;
var fileBubbles = fileList.map(function(f, i) {
    var meta = fileMeta[f];
    var angle = (i / Math.max(fileList.length, 1)) * Math.PI * 2;
    var r = Math.max(200, fileList.length * 30);
    var lines = compactOverview ? 0 : Math.min(meta.topLevel.length, 6);
    return {
        file: f, color: fileColors[f], meta: meta,
        x: W/2 + Math.cos(angle) * r, y: H/2 + Math.sin(angle) * r,
        vx: 0, vy: 0, width: 160, height: compactOverview ? 40 : (36 + lines * 15 + 18)
    };
});
var bubbleMap = {};
fileBubbles.forEach(function(b) { bubbleMap[b.file] = b; });

var bubbleEdges = interFileList.map(function(e) {
    return { source: bubbleMap[e.from], target: bubbleMap[e.to], count: e.count };
}).filter(function(e) { return e.source && e.target; });

// Compute bubble widths from text
(function() {
    ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
    fileBubbles.forEach(function(b) {
        var maxW = ctx.measureText(b.file).width;
        if (!compactOverview) {
            ctx.font = '10px "Segoe UI",system-ui,sans-serif';
            b.meta.topLevel.slice(0, 6).forEach(function(n) {
                var tw = ctx.measureText(n.label).width + 30;
                if (tw > maxW) maxW = tw;
            });
        }
        b.width = Math.max(maxW + 24, compactOverview ? 100 : 130);
        ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
    });
})();

// Grid layout grouped by namespace, groups shelf-packed into rows
var groupBoxes = [];
var showAllLinks = false;
(function() {
    var n = fileBubbles.length;
    if (n === 0) return;
    var maxBW = 0, maxBH = 0;
    fileBubbles.forEach(function(b) {
        b.matched = true;
        if (b.width > maxBW) maxBW = b.width;
        if (b.height > maxBH) maxBH = b.height;
    });
    var cellW = maxBW + (compactOverview ? 24 : 50);
    var cellH = maxBH + (compactOverview ? 18 : 40);
    var cols = Math.max(4, Math.ceil(Math.sqrt(n * 1.8)));
    var rowW = cols * cellW, headerH = 22, gap = 28;
    var groups = {}, order = [];
    fileBubbles.forEach(function(b) {
        var dot = b.file.lastIndexOf('.');
        var k = dot > 0 ? b.file.slice(0, dot) : '(root)';
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(b);
    });
    var x = 0, y = 0, shelfH = 0;
    order.forEach(function(k) {
        var g = groups[k];
        var gc = Math.min(g.length, cols), gr = Math.ceil(g.length / gc);
        var bw = gc * cellW, bh = headerH + gr * cellH;
        if (x > 0 && x + bw > rowW) { x = 0; y += shelfH + gap; shelfH = 0; }
        groupBoxes.push({ label: k, count: g.length, x: x, y: y, w: bw, h: bh });
        g.forEach(function(b, i) {
            b.x = x + (i % gc) * cellW + cellW / 2;
            b.y = y + headerH + Math.floor(i / gc) * cellH + cellH / 2;
            b.vx = 0; b.vy = 0;
        });
        x += bw + gap;
        if (bh > shelfH) shelfH = bh;
    });
    var ox = W/2 - rowW/2, oy = H/2 - (y + shelfH)/2;
    fileBubbles.forEach(function(b) { b.x += ox; b.y += oy; });
    groupBoxes.forEach(function(g) { g.x += ox; g.y += oy; });
})();

// Auto-fit zoom for grid extent
var camX = 0, camY = 0, camZoom = 1;
if (multiFile && fileBubbles.length > 2) {
    var ext = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    fileBubbles.forEach(function(b) {
        var l = b.x - b.width/2 - 30, r = b.x + b.width/2 + 30;
        var t = b.y - b.height/2 - 30, bo = b.y + b.height/2 + 30;
        if (l < ext.minX) ext.minX = l; if (r > ext.maxX) ext.maxX = r;
        if (t < ext.minY) ext.minY = t; if (bo > ext.maxY) ext.maxY = bo;
    });
    var gw = ext.maxX - ext.minX, gh = ext.maxY - ext.minY;
    camZoom = Math.min(1, Math.min((W - 60) / gw, (H - 100) / gh));
}

// ═══════════════════════════════════════════
// VIEW STATE
// ═══════════════════════════════════════════
var viewMode = multiFile ? 'overview' : 'detail';
var activeFile = multiFile ? null : fileList[0];
var overviewCam = { x: 0, y: 0, zoom: 1 };
var dragStart = null, dragCam = null, dragNode = null, dragBubble = null;
var hoveredNode = null, hoveredBubble = null, selectedNode = null;
var simCooldown = 300;

// Detail-mode filtered data
var detailNodes = [], detailEdges = [], portalNodes = [];
var activeGroups = { Imports:1, Pools:1, Functions:1, SubRoutines:1, Loops:1, Fields:1, Exports:1, Macros:1 };

function enterDetail(file) {
    if (viewMode === 'overview') { overviewCam = { x: camX, y: camY, zoom: camZoom }; }
    viewMode = 'detail';
    activeFile = file;
    rebuildDetail();
    camX = 0; camY = 0; camZoom = 1;
    simCooldown = 300;
    updateHUD();
}

function exitToOverview() {
    viewMode = 'overview';
    activeFile = null;
    detail.style.display = 'none'; selectedNode = null;
    camX = overviewCam.x; camY = overviewCam.y; camZoom = overviewCam.zoom;
    simCooldown = 120;
    updateHUD();
}

function rebuildDetail() {
    var fNodes = allNodes.filter(function(n) { return n.file === activeFile; });
    fNodes.forEach(function(n, i) {
        var angle = (i / Math.max(fNodes.length, 1)) * Math.PI * 2;
        var r = 100 + Math.random() * 60;
        n.x = W/2 + Math.cos(angle) * r;
        n.y = H/2 + Math.sin(angle) * r;
        n.vx = 0; n.vy = 0;
    });
    var fSet = {};
    fNodes.forEach(function(n) { fSet[n.id] = true; });

    // Intra-file edges
    var intraEdges = allEdges.filter(function(e) { return fSet[e.source.id] && fSet[e.target.id]; });

    // Cross-file connections → portal nodes
    var portalMap = {};
    allEdges.forEach(function(e) {
        if (e.type === 'scope') return;
        var outgoing = fSet[e.source.id] && !fSet[e.target.id];
        var incoming = !fSet[e.source.id] && fSet[e.target.id];
        if (outgoing) {
            var f = e.target.file;
            if (!portalMap[f]) portalMap[f] = { file: f, outCalls: [], inCalls: [] };
            portalMap[f].outCalls.push(e);
        }
        if (incoming) {
            var f2 = e.source.file;
            if (!portalMap[f2]) portalMap[f2] = { file: f2, outCalls: [], inCalls: [] };
            portalMap[f2].inCalls.push(e);
        }
    });

    portalNodes = [];
    var pKeys = Object.keys(portalMap);
    pKeys.forEach(function(f, i) {
        var pm = portalMap[f];
        var angle = (i / Math.max(pKeys.length, 1)) * Math.PI * 2;
        var pn = {
            id: '__portal__' + f, label: f, file: f, isPortal: true,
            x: W/2 + Math.cos(angle) * 280, y: H/2 + Math.sin(angle) * 280,
            vx: 0, vy: 0, radius: 20,
            color: fileColors[f] || '#666',
            totalCalls: pm.outCalls.length + pm.inCalls.length,
            visible: true, matched: true, group: 'Portal'
        };
        portalNodes.push(pn);

        pm.outCalls.forEach(function(e) {
            intraEdges.push({ source: e.source, target: pn, type: 'crossFile', crossFile: true });
        });
        pm.inCalls.forEach(function(e) {
            intraEdges.push({ source: pn, target: e.target, type: 'crossFile', crossFile: true });
        });
    });

    detailNodes = fNodes.concat(portalNodes);
    detailEdges = intraEdges;
    updateVisibility();
}

function updateHUD() {
    linksBtn.style.display = viewMode === 'overview' ? 'block' : 'none';
    openFileBtn.style.display = viewMode === 'detail' ? 'block' : 'none';
    if (viewMode === 'overview') {
        backBtn.style.display = 'none';
        groupFiltersEl.style.display = 'none';
        breadcrumb.innerHTML = '<span>Connectome</span> · ' + fileList.length + ' files · ' + allNodes.length + ' nodes';
    } else {
        backBtn.style.display = multiFile ? 'block' : 'none';
        groupFiltersEl.style.display = 'flex';
        var fc = fileColors[activeFile] || '#888';
        breadcrumb.innerHTML = (multiFile ? 'Overview › ' : '') +
            '<span style="color:' + fc + '">' + activeFile + '</span> · ' +
            fileMeta[activeFile].count + ' nodes';
    }
}

function updateVisibility() {
    var q = searchInput.value.toLowerCase().trim();
    if (viewMode === 'detail') {
        detailNodes.forEach(function(n) {
            if (n.isPortal) { n.visible = true; n.matched = true; return; }
            n.matched = !q || n.id.toLowerCase().indexOf(q) >= 0 || n.kind.toLowerCase().indexOf(q) >= 0;
            n.visible = !!activeGroups[n.group] && n.matched;
        });
    } else {
        fileBubbles.forEach(function(b) {
            b.matched = !q || b.file.toLowerCase().indexOf(q) >= 0 ||
                b.meta.nodes.some(function(n) { return n.label.toLowerCase().indexOf(q) >= 0; });
        });
    }
}

// Group filters
document.querySelectorAll('.filter-btn[data-group]').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var g = btn.getAttribute('data-group');
        if (g === 'all') {
            var allBtns = document.querySelectorAll('.filter-btn[data-group]');
            var allActive = true;
            allBtns.forEach(function(b) { if (!b.classList.contains('active')) allActive = false; });
            allBtns.forEach(function(b) {
                if (allActive) { b.classList.remove('active'); activeGroups = {}; }
                else { b.classList.add('active'); var gg = b.getAttribute('data-group'); if (gg !== 'all') activeGroups[gg] = 1; }
            });
        } else {
            btn.classList.toggle('active');
            if (activeGroups[g]) delete activeGroups[g]; else activeGroups[g] = 1;
        }
        updateVisibility();
    });
});
searchInput.addEventListener('input', function() { updateVisibility(); simCooldown = Math.max(simCooldown, 60); });
backBtn.addEventListener('click', exitToOverview);
function openModule(file) {
    if (file === 'main') vscode.postMessage({ type: 'goto', line: 1, id: '' });
    else vscode.postMessage({ type: 'openFile', file: null, name: file });
}
var openFileBtn = document.getElementById('open-file-btn');
openFileBtn.addEventListener('click', function() { if (activeFile) openModule(activeFile); });
canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    var b = hitTestBubble(e.clientX, e.clientY);
    if (b) { openModule(b.file); return; }
    var n = hitTestNode(e.clientX, e.clientY);
    if (n && n.isPortal) openModule(n.file);
});
var linksBtn = document.getElementById('links-btn');
linksBtn.addEventListener('click', function() {
    showAllLinks = !showAllLinks;
    linksBtn.classList.toggle('active', showAllLinks);
});

// ═══════════════════════════════════════════
// CAMERA & INPUT
// ═══════════════════════════════════════════
function screenToWorld(sx, sy) {
    return { x: (sx - W/2) / camZoom + W/2 - camX, y: (sy - H/2) / camZoom + H/2 - camY };
}

function hitTestNode(mx, my) {
    if (viewMode !== 'detail') return null;
    var p = screenToWorld(mx, my);
    for (var i = detailNodes.length - 1; i >= 0; i--) {
        var n = detailNodes[i];
        if (!n.visible) continue;
        var dx = p.x - n.x, dy = p.y - n.y;
        var hr = n.isPortal ? n.radius + 6 : n.radius + 4;
        if (dx*dx + dy*dy < hr * hr) return n;
    }
    return null;
}

function hitTestBubble(mx, my) {
    if (viewMode !== 'overview') return null;
    var p = screenToWorld(mx, my);
    for (var i = fileBubbles.length - 1; i >= 0; i--) {
        var b = fileBubbles[i];
        if (p.x >= b.x - b.width/2 && p.x <= b.x + b.width/2 &&
            p.y >= b.y - b.height/2 && p.y <= b.y + b.height/2) return b;
    }
    return null;
}

canvas.addEventListener('mousedown', function(e) {
    if (viewMode === 'detail') {
        var n = hitTestNode(e.clientX, e.clientY);
        if (n) { dragNode = n; canvas.classList.add('dragging'); return; }
    }
    if (viewMode === 'overview') {
        var b = hitTestBubble(e.clientX, e.clientY);
        if (b) { dragBubble = b; canvas.classList.add('dragging'); return; }
    }
    dragStart = { x: e.clientX, y: e.clientY };
    dragCam = { x: camX, y: camY };
    canvas.classList.add('dragging');
});

canvas.addEventListener('mousemove', function(e) {
    if (dragNode) {
        var p = screenToWorld(e.clientX, e.clientY);
        dragNode.x = p.x; dragNode.y = p.y; dragNode.vx = 0; dragNode.vy = 0;
    } else if (dragBubble) {
        var p2 = screenToWorld(e.clientX, e.clientY);
        dragBubble.x = p2.x; dragBubble.y = p2.y; dragBubble.vx = 0; dragBubble.vy = 0;
    } else if (dragStart) {
        camX = dragCam.x + (e.clientX - dragStart.x) / camZoom;
        camY = dragCam.y + (e.clientY - dragStart.y) / camZoom;
    } else {
        var nn = hitTestNode(e.clientX, e.clientY);
        var bb = hitTestBubble(e.clientX, e.clientY);
        hoveredNode = nn; hoveredBubble = bb;
        if (nn || bb) {
            canvas.style.cursor = 'pointer';
            if (nn) showTooltipNode(nn, e.clientX, e.clientY);
            else if (bb) showTooltipBubble(bb, e.clientX, e.clientY);
        } else {
            canvas.style.cursor = 'grab';
            tooltip.style.display = 'none';
        }
    }
});

canvas.addEventListener('mouseup', function() {
    dragNode = null; dragBubble = null; dragStart = null; dragCam = null;
    canvas.classList.remove('dragging');
});

canvas.addEventListener('click', function(e) {
    if (viewMode === 'overview') {
        var b = hitTestBubble(e.clientX, e.clientY);
        if (b) { enterDetail(b.file); return; }
    }
    if (viewMode === 'detail') {
        var n = hitTestNode(e.clientX, e.clientY);
        if (n) {
            if (n.isPortal && multiFile) { enterDetail(n.file); return; }
            selectedNode = n; showDetailPanel(n);
        }
    }
});

canvas.addEventListener('dblclick', function(e) {
    var n = hitTestNode(e.clientX, e.clientY);
    if (n && !n.isPortal) vscode.postMessage({ type: 'goto', line: n.line, id: n.id });
});

canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    var factor = e.deltaY > 0 ? 0.92 : 1.08;
    camZoom = Math.max(0.15, Math.min(5, camZoom * factor));
}, { passive: false });

function showTooltipBubble(b, mx, my) {
    tooltip.querySelector('.tt-kind').textContent = 'FILE MODULE';
    tooltip.querySelector('.tt-kind').style.color = b.color;
    tooltip.querySelector('.tt-name').textContent = b.file;
    var det = b.meta.count + ' nodes\n' + b.meta.topLevel.length + ' top-level symbols';
    var outEdges = interFileList.filter(function(e) { return e.from === b.file; });
    var inEdges = interFileList.filter(function(e) { return e.to === b.file; });
    if (outEdges.length) det += '\nCalls out to: ' + outEdges.map(function(e) { return e.to + ' (' + e.count + ')'; }).join(', ');
    if (inEdges.length) det += '\nCalled by: ' + inEdges.map(function(e) { return e.from + ' (' + e.count + ')'; }).join(', ');
    tooltip.querySelector('.tt-detail').textContent = det;
    tooltip.querySelector('.tt-hint').textContent = 'Click to explore · Right-click to open file';
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(mx + 12, W - 310) + 'px';
    tooltip.style.top = Math.min(my + 12, H - 120) + 'px';
}

function showTooltipNode(n, mx, my) {
    if (n.isPortal) {
        tooltip.querySelector('.tt-kind').textContent = 'EXTERNAL FILE';
        tooltip.querySelector('.tt-kind').style.color = n.color;
        tooltip.querySelector('.tt-name').textContent = n.label;
        tooltip.querySelector('.tt-detail').textContent = n.totalCalls + ' cross-file calls';
        tooltip.querySelector('.tt-hint').textContent = 'Click to navigate · Right-click to open file';
    } else {
        tooltip.querySelector('.tt-kind').textContent = n.kind;
        tooltip.querySelector('.tt-kind').style.color = n.color;
        tooltip.querySelector('.tt-name').textContent = n.id;
        var callsOut = detailEdges.filter(function(e) { return e.source.id === n.id && e.type === 'call'; }).map(function(e) { return e.target.id; });
        var callsIn = detailEdges.filter(function(e) { return e.target.id === n.id && e.type === 'call'; }).map(function(e) { return e.source.id; });
        var det = '';
        if (callsOut.length) det += 'Calls: ' + callsOut.join(', ') + '\n';
        if (callsIn.length) det += 'Called by: ' + callsIn.join(', ');
        if (n.scope) det += (det ? '\n' : '') + 'Scope: ' + n.scope;
        tooltip.querySelector('.tt-detail').textContent = det || n.group;
        tooltip.querySelector('.tt-hint').textContent = 'Click for details · Double-click to go to definition';
    }
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(mx + 12, W - 310) + 'px';
    tooltip.style.top = Math.min(my + 12, H - 120) + 'px';
}

function showDetailPanel(n) {
    detail.style.display = 'block';
    detail.querySelector('.dp-kind').textContent = n.kind;
    detail.querySelector('.dp-kind').style.color = n.color;
    detail.querySelector('.dp-name').textContent = n.id;
    detail.querySelector('.dp-scope').textContent = (n.scope ? 'in ' + n.scope : '') + (n.file ? (n.scope ? ' · ' : '') + n.file : '');
    var outSec = document.getElementById('dp-calls-out');
    var callsOut = detailEdges.filter(function(e) { return e.source.id === n.id && e.type === 'call'; });
    if (callsOut.length) {
        outSec.innerHTML = '<div class="dp-section-title">Calls (' + callsOut.length + ')</div>';
        callsOut.forEach(function(e) {
            var a = document.createElement('a'); a.className = 'dp-link';
            a.textContent = '→ ' + e.target.id;
            a.addEventListener('click', function() { focusNode(e.target); });
            outSec.appendChild(a);
        });
    } else { outSec.innerHTML = ''; }
    var inSec = document.getElementById('dp-calls-in');
    var callsIn = detailEdges.filter(function(e) { return e.target.id === n.id && e.type === 'call'; });
    if (callsIn.length) {
        inSec.innerHTML = '<div class="dp-section-title">Called by (' + callsIn.length + ')</div>';
        callsIn.forEach(function(e) {
            var a = document.createElement('a'); a.className = 'dp-link';
            a.textContent = '← ' + e.source.id;
            a.addEventListener('click', function() { focusNode(e.source); });
            inSec.appendChild(a);
        });
    } else { inSec.innerHTML = ''; }
    var childSec = document.getElementById('dp-children');
    var children = detailNodes.filter(function(c) { return c.scope === n.id; });
    if (children.length) {
        childSec.innerHTML = '<div class="dp-section-title">Contains (' + children.length + ')</div>';
        children.forEach(function(c) {
            var a = document.createElement('a'); a.className = 'dp-link';
            a.textContent = c.kind + ': ' + c.id;
            a.addEventListener('click', function() { focusNode(c); });
            childSec.appendChild(a);
        });
    } else { childSec.innerHTML = ''; }
    document.getElementById('dp-goto').onclick = function() { vscode.postMessage({ type: 'goto', line: n.line, id: n.id }); };
    var openBtn = document.getElementById('dp-open-file');
    var imp = data.imports.find(function(ii) { return ii.name === n.id; });
    if (n.kind === 'Import' && imp) {
        openBtn.style.display = 'inline-block'; openBtn.textContent = 'Open File';
        openBtn.onclick = function() { vscode.postMessage({ type: 'openFile', file: imp.file, name: n.id }); };
    } else if (n.file && n.file !== 'main') {
        openBtn.style.display = 'inline-block'; openBtn.textContent = 'Open ' + n.file;
        openBtn.style.background = fileColors[n.file] || '#e94560';
        openBtn.onclick = function() { vscode.postMessage({ type: 'openFile', file: null, name: n.file }); };
    } else { openBtn.style.display = 'none'; }
}

function focusNode(n) { selectedNode = n; showDetailPanel(n); camX = -(n.x - W/2); camY = -(n.y - H/2); camZoom = 1.5; }
detail.querySelector('.dp-close').addEventListener('click', function() { detail.style.display = 'none'; selectedNode = null; });

// ═══════════════════════════════════════════
// SIMULATION
// ═══════════════════════════════════════════
function simulateOverview() {
    // Grid layout is static — no physics. Just drain the cooldown.
    if (simCooldown > 0) simCooldown = 0;
}

function simulateDetail() {
    var alpha = Math.max(0.001, simCooldown > 0 ? 0.3 * (simCooldown / 300) : 0.001);
    if (simCooldown > 0) simCooldown--;
    for (var i = 0; i < detailNodes.length; i++) {
        if (!detailNodes[i].visible) continue;
        for (var j = i + 1; j < detailNodes.length; j++) {
            if (!detailNodes[j].visible) continue;
            var a = detailNodes[i], b = detailNodes[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var dist = Math.sqrt(dx*dx + dy*dy) || 1;
            var force = -800 / (dist * dist);
            var fx = (dx / dist) * force * alpha, fy = (dy / dist) * force * alpha;
            a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
        }
    }
    detailEdges.forEach(function(e) {
        if (!e.source.visible || !e.target.visible) return;
        var dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
        var dist = Math.sqrt(dx*dx + dy*dy) || 1;
        var ideal = e.type === 'scope' ? 50 : (e.crossFile ? 180 : 100);
        var force = (dist - ideal) * 0.005 * alpha;
        var fx = (dx / dist) * force, fy = (dy / dist) * force;
        e.source.vx += fx; e.source.vy += fy; e.target.vx -= fx; e.target.vy -= fy;
    });
    // Group clustering
    var gc = {};
    detailNodes.forEach(function(n) {
        if (!n.visible || n.isPortal) return;
        if (!gc[n.group]) gc[n.group] = { x:0, y:0, c:0 };
        gc[n.group].x += n.x; gc[n.group].y += n.y; gc[n.group].c++;
    });
    Object.keys(gc).forEach(function(g) { gc[g].x /= gc[g].c; gc[g].y /= gc[g].c; });
    detailNodes.forEach(function(n) {
        if (!n.visible || n.isPortal || !gc[n.group]) return;
        n.vx += (gc[n.group].x - n.x) * 0.003 * alpha;
        n.vy += (gc[n.group].y - n.y) * 0.003 * alpha;
    });
    // Center gravity + damping + boundary
    var bound = Math.max(400, Math.sqrt(detailNodes.length) * 55);
    detailNodes.forEach(function(n) {
        if (!n.visible) return;
        n.vx += (W/2 - n.x) * 0.002 * alpha;
        n.vy += (H/2 - n.y) * 0.002 * alpha;
        if (dragNode !== n) {
            n.vx *= 0.75; n.vy *= 0.75;
            n.x += n.vx; n.y += n.vy;
            if (n.x < W/2 - bound) { n.x = W/2 - bound; n.vx = 0; }
            if (n.x > W/2 + bound) { n.x = W/2 + bound; n.vx = 0; }
            if (n.y < H/2 - bound) { n.y = H/2 - bound; n.vy = 0; }
            if (n.y > H/2 + bound) { n.y = H/2 + bound; n.vy = 0; }
        }
    });
}

// ═══════════════════════════════════════════
// DRAWING
// ═══════════════════════════════════════════
function hexAlpha(hex, a) {
    if (!hex || hex.length < 7) return 'rgba(128,128,128,' + a + ')';
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}

function rectExit(b, dx, dy) {
    var hw = b.width / 2, hh = b.height / 2;
    var t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
    return { x: b.x + dx * t, y: b.y + dy * t };
}

function drawOverview() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W/2, H/2); ctx.scale(camZoom, camZoom); ctx.translate(-W/2 + camX, -H/2 + camY);

    var focus = hoveredBubble;
    var linked = null;
    if (focus) {
        linked = {}; linked[focus.file] = 1;
        bubbleEdges.forEach(function(e) {
            if (e.source === focus) linked[e.target.file] = 1;
            if (e.target === focus) linked[e.source.file] = 1;
        });
    }
    var searching = searchInput.value.trim() !== '';

    // Namespace group frames
    groupBoxes.forEach(function(g) {
        roundRect(g.x - 8, g.y - 4, g.w + 16, g.h + 8, 10);
        ctx.fillStyle = 'rgba(255,255,255,0.025)'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
        ctx.fillStyle = 'rgba(200,200,220,0.55)'; ctx.textAlign = 'left';
        ctx.fillText(g.label + '  ·  ' + g.count, g.x + 2, g.y + 13);
    });

    // Links: only the hovered file's, unless "All links" is on
    bubbleEdges.forEach(function(e) {
        var touches = focus && (e.source === focus || e.target === focus);
        if (!touches && !showAllLinks) return;
        var col = e.source.color || '#888';
        var al = touches ? 0.9 : (focus ? 0.04 : 0.14);
        var dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
        var dist = Math.sqrt(dx*dx + dy*dy) || 1;
        // Bend sideways so A→B and B→A don't overlap
        var cx = (e.source.x + e.target.x) / 2 - dy / dist * dist * 0.15;
        var cy = (e.source.y + e.target.y) / 2 + dx / dist * dist * 0.15;
        var s = rectExit(e.source, cx - e.source.x, cy - e.source.y);
        var t = rectExit(e.target, cx - e.target.x, cy - e.target.y);
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.quadraticCurveTo(cx, cy, t.x, t.y);
        ctx.strokeStyle = hexAlpha(col, al);
        ctx.lineWidth = touches ? Math.min(1.5 + e.count * 0.3, 5) : 1;
        ctx.stroke();
        var adx = t.x - cx, ady = t.y - cy, ad = Math.sqrt(adx*adx + ady*ady) || 1;
        var ux = adx/ad, uy = ady/ad, sz = touches ? 9 : 5;
        ctx.beginPath(); ctx.moveTo(t.x, t.y);
        ctx.lineTo(t.x - ux*sz - uy*sz*0.5, t.y - uy*sz + ux*sz*0.5);
        ctx.lineTo(t.x - ux*sz + uy*sz*0.5, t.y - uy*sz - ux*sz*0.5);
        ctx.closePath(); ctx.fillStyle = hexAlpha(col, al); ctx.fill();
        if (touches) {
            var mx = 0.25*s.x + 0.5*cx + 0.25*t.x, my = 0.25*s.y + 0.5*cy + 0.25*t.y;
            ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
            ctx.textAlign = 'center';
            var lbl = e.count + (e.count === 1 ? ' call' : ' calls');
            var lw = ctx.measureText(lbl).width + 8;
            roundRect(mx - lw/2, my - 8, lw, 15, 4);
            ctx.fillStyle = '#111118'; ctx.fill();
            ctx.fillStyle = col; ctx.fillText(lbl, mx, my + 3);
        }
    });

    // File bubbles
    fileBubbles.forEach(function(b) {
        var dim = (linked && !linked[b.file]) || (searching && !b.matched);
        var isHov = focus === b;
        var isLinked = linked && linked[b.file] && !isHov;
        ctx.globalAlpha = dim ? 0.15 : 1;
        var bx = b.x - b.width/2, by = b.y - b.height/2;
        roundRect(bx, by, b.width, b.height, 8);
        ctx.fillStyle = '#16161f'; ctx.fill();
        ctx.fillStyle = hexAlpha(b.color, isHov ? 0.22 : (isLinked ? 0.14 : 0.07)); ctx.fill();
        ctx.strokeStyle = hexAlpha(b.color, isHov ? 1 : (isLinked ? 0.8 : 0.4));
        ctx.lineWidth = isHov ? 2.5 : (isLinked ? 2 : 1.2); ctx.stroke();

        if (compactOverview) {
            ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
            ctx.fillStyle = b.color; ctx.textAlign = 'center';
            ctx.fillText(b.file, b.x, b.y + 1);
            ctx.font = '9px "Segoe UI",system-ui,sans-serif';
            ctx.fillStyle = hexAlpha(b.color, 0.55);
            ctx.fillText(b.meta.count + ' nodes', b.x, b.y + 14);
        } else {
            ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
            ctx.fillStyle = b.color; ctx.textAlign = 'center';
            ctx.fillText(b.file, b.x, by + 18);
            ctx.beginPath(); ctx.moveTo(bx + 8, by + 26); ctx.lineTo(bx + b.width - 8, by + 26);
            ctx.strokeStyle = hexAlpha(b.color, 0.2); ctx.lineWidth = 0.5; ctx.stroke();
            ctx.font = '10px "Segoe UI",system-ui,sans-serif';
            ctx.textAlign = 'left';
            var maxLines = 6, top = b.meta.topLevel;
            for (var i = 0; i < Math.min(top.length, maxLines); i++) {
                var n = top[i];
                var kindShort = n.kind === 'SubRoutine' ? 'Sub' : (n.kind === 'Import' ? 'Imp' : n.kind.substring(0, 4));
                ctx.fillStyle = hexAlpha(n.color || '#888', 0.7);
                ctx.fillText(kindShort, bx + 8, by + 40 + i * 14);
                ctx.fillStyle = hexAlpha('#d4d4d4', 0.8);
                ctx.fillText(n.label, bx + 36, by + 40 + i * 14);
            }
            if (top.length > maxLines) {
                ctx.fillStyle = hexAlpha('#888', 0.5);
                ctx.fillText('+ ' + (top.length - maxLines) + ' more...', bx + 8, by + 40 + maxLines * 14);
            }
            ctx.font = '9px "Segoe UI",system-ui,sans-serif';
            ctx.fillStyle = hexAlpha(b.color, 0.4); ctx.textAlign = 'center';
            ctx.fillText(b.meta.count + ' total nodes', b.x, by + b.height - 6);
        }
        ctx.globalAlpha = 1;
    });

    ctx.restore();
    statsEl.textContent = fileList.length + ' files · ' + allNodes.length + ' nodes · ' +
        interFileList.length + ' cross-file links · hover a file to see its links, click to explore';
}

function drawDetail() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W/2, H/2); ctx.scale(camZoom, camZoom); ctx.translate(-W/2 + camX, -H/2 + camY);

    // Edges
    detailEdges.forEach(function(e) {
        if (!e.source.visible || !e.target.visible) return;
        var hl = selectedNode && (e.source.id === selectedNode.id || e.target.id === selectedNode.id);
        ctx.beginPath(); ctx.moveTo(e.source.x, e.source.y); ctx.lineTo(e.target.x, e.target.y);
        var eColor = e.source.color || '#888';
        if (e.type === 'scope') {
            ctx.strokeStyle = hexAlpha(eColor, hl ? 0.35 : 0.07);
            ctx.setLineDash([3, 4]);
        } else if (e.crossFile) {
            ctx.strokeStyle = hexAlpha(eColor, hl ? 0.8 : 0.3);
            ctx.setLineDash([6, 3]);
        } else {
            ctx.strokeStyle = hexAlpha(eColor, hl ? 0.7 : 0.15);
            ctx.setLineDash([]);
        }
        ctx.lineWidth = hl ? 2 : 0.8; ctx.stroke(); ctx.setLineDash([]);
        if (e.type !== 'scope') {
            var ddx = e.target.x - e.source.x, ddy = e.target.y - e.source.y;
            var dd = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
            var ux = ddx/dd, uy = ddy/dd;
            var ax = e.target.x - ux * (e.target.radius + 3), ay = e.target.y - uy * (e.target.radius + 3);
            var sz = hl ? 6 : 4;
            ctx.beginPath(); ctx.moveTo(ax, ay);
            ctx.lineTo(ax - ux*sz - uy*sz*0.5, ay - uy*sz + ux*sz*0.5);
            ctx.lineTo(ax - ux*sz + uy*sz*0.5, ay - uy*sz - ux*sz*0.5);
            ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
        }
    });

    // Nodes
    detailNodes.forEach(function(n) {
        if (!n.visible) return;
        var isSel = selectedNode && selectedNode.id === n.id;
        var isConn = selectedNode && detailEdges.some(function(e) {
            return (e.source.id === selectedNode.id && e.target.id === n.id) || (e.target.id === selectedNode.id && e.source.id === n.id);
        });
        var isHov = hoveredNode && hoveredNode.id === n.id;
        var dimmed = selectedNode && !isSel && !isConn;
        var al = dimmed ? 0.2 : 1;

        if (n.isPortal) {
            // Portal: dashed circle with file name
            ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
            ctx.fillStyle = hexAlpha(n.color, isHov ? 0.25 : 0.1); ctx.fill();
            ctx.strokeStyle = hexAlpha(n.color, isHov ? 0.8 : 0.5);
            ctx.lineWidth = isHov ? 2 : 1.5; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
            ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
            ctx.fillStyle = n.color; ctx.textAlign = 'center';
            ctx.fillText(n.label, n.x, n.y + 3);
            ctx.font = '8px "Segoe UI",system-ui,sans-serif';
            ctx.fillStyle = hexAlpha(n.color, 0.6);
            ctx.fillText(n.totalCalls + ' calls', n.x, n.y + n.radius + 12);
        } else {
            if (isSel || isHov) {
                ctx.beginPath(); ctx.arc(n.x, n.y, n.radius + 8, 0, Math.PI * 2);
                ctx.fillStyle = n.color + '22'; ctx.fill();
            }
            ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
            ctx.fillStyle = hexAlpha(n.color, al); ctx.fill();
            if (isSel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
            var showLabel = camZoom > 0.5 || isSel || isHov || isConn || n.radius > 12;
            if (showLabel) {
                var fs = n.radius > 10 ? 11 : 9;
                ctx.font = (isSel ? 'bold ' : '') + fs + 'px "Segoe UI",system-ui,sans-serif';
                ctx.fillStyle = hexAlpha('#d4d4d4', dimmed ? 0.3 : 0.9); ctx.textAlign = 'center';
                ctx.fillText(n.label, n.x, n.y + n.radius + fs + 3);
            }
        }
    });

    ctx.restore();
    var vis = detailNodes.filter(function(n) { return n.visible && !n.isPortal; }).length;
    var total = detailNodes.filter(function(n) { return !n.isPortal; }).length;
    var ve = detailEdges.filter(function(e) { return e.source.visible && e.target.visible; }).length;
    statsEl.textContent = vis + '/' + total + ' nodes · ' + ve + ' edges · ' +
        portalNodes.length + ' linked files';
}

function draw() {
    if (viewMode === 'overview') drawOverview();
    else drawDetail();
}

// ═══════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════
function loop() {
    if (simCooldown > 0 || dragNode || dragBubble) {
        if (viewMode === 'overview') simulateOverview();
        else simulateDetail();
    }
    draw();
    requestAnimationFrame(loop);
}

// Init
if (viewMode === 'detail') rebuildDetail();
updateHUD();
loop();

canvas.addEventListener('mousedown', function() { simCooldown = Math.max(simCooldown, 60); });
searchInput.addEventListener('input', function() { simCooldown = Math.max(simCooldown, 120); });
})();
</script>
</body>
</html>
